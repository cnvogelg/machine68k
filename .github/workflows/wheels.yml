name: Build and publish wheels

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist
      - name: Locate the source distribution
        id: sdist
        shell: python
        run: |
          import os
          from pathlib import Path

          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, archives
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"path={archives[0].as_posix()}", file=output)
      - name: Build and test wheels from the source distribution
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-* cp315-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS: auto64
          CIBW_TEST_REQUIRES: pytest pytest-benchmark rmachine68k greenlet
          CIBW_TEST_COMMAND: python -m pytest {project}/test --benchmark-disable
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: >-
      github.repository == 'cnvogelg/machine68k' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/machine68k
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
